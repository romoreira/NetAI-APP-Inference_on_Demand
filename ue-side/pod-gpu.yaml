apiVersion: v1
kind: Pod
metadata:
  name: ue-test
  annotations:
    k8s.v1.cni.cncf.io/networks: n3-net
spec:
  restartPolicy: Never
  containers:
  - name: ue
    image: nvidia/cuda:12.4.0-base-ubuntu22.04
    command: ["sleep", "3600"]
    securityContext:
      capabilities:
        add: ["NET_RAW", "NET_ADMIN"]
    resources:
      limits:
        nvidia.com/gpu: 1
